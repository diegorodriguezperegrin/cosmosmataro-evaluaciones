<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Diagrama de Hertzsprung-Russell amb la posició del Sol</title>
  <desc id="svg-desc">Diagrama de Hertzsprung-Russell que representa la lluminositat solar en escala logarítmica respecte a la temperatura superficial i les classes espectrals O B A F G K M. Mostra quatre regions d'estrelles sense etiquetar i un marcador daurat per al Sol (G2V, 1 L☉) situat sobre la banda diagonal central.</desc>
  <defs>
    <radialGradient id="hr-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#13203d"/>
      <stop offset="100%" stop-color="#070c19"/>
    </radialGradient>
    <linearGradient id="ms-band" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="58%" stop-color="#fde047" stop-opacity="0.42"/>
      <stop offset="80%" stop-color="#fb923c" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.40"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="680" height="420" rx="14" fill="url(#hr-bg)"/>

  <!-- Àrea del gràfic: x = 95..615, y = 62..348 -->
  <rect x="95" y="62" width="520" height="286" rx="6" fill="#060913" fill-opacity="0.7" stroke="#334155" stroke-width="1.2"/>

  <!-- Quadrícula suau -->
  <g stroke="#1e293b" stroke-width="1">
    <!-- Horitzontals (10^6, 10^4, 10^2, 1, 10^-2, 10^-4) -->
    <line x1="95" y1="74" x2="615" y2="74"/>
    <line x1="95" y1="128" x2="615" y2="128"/>
    <line x1="95" y1="182" x2="615" y2="182"/>
    <line x1="95" y1="236" x2="615" y2="236" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="95" y1="290" x2="615" y2="290"/>
    <line x1="95" y1="344" x2="615" y2="344"/>
    <!-- Verticals (O B A F G K M) -->
    <line x1="130" y1="62" x2="130" y2="348"/>
    <line x1="200" y1="62" x2="200" y2="348"/>
    <line x1="275" y1="62" x2="275" y2="348"/>
    <line x1="350" y1="62" x2="350" y2="348"/>
    <line x1="420" y1="62" x2="420" y2="348" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="495" y1="62" x2="495" y2="348"/>
    <line x1="570" y1="62" x2="570" y2="348"/>
  </g>

  <!-- 4 Regions del diagrama (sense revelar els noms!) -->
  <!-- 1. Franja superior (Supergegants) -->
  <ellipse cx="385" cy="84" rx="185" ry="15" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.45" stroke-dasharray="4 3"/>

  <!-- 2. Branca superior dreta (Gegants) -->
  <path d="M 442 192 Q 490 142 578 128 Q 596 156 575 182 Q 515 198 465 215 Z" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c" stroke-opacity="0.5" stroke-dasharray="4 3"/>

  <!-- 3. Banda diagonal (Seqüència principal) -->
  <path d="M 114 82 C 165 118, 225 162, 295 192 C 358 219, 430 232, 495 264 C 538 286, 572 310, 594 334 L 568 344 C 542 322, 505 298, 458 274 C 398 244, 326 232, 255 198 C 195 169, 138 128, 102 96 Z" fill="url(#ms-band)" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>

  <!-- 4. Franja inferior esquerra (Nanes blanques) -->
  <ellipse cx="265" cy="316" rx="102" ry="16" fill="#bae6fd" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-dasharray="4 3"/>

  <!-- Estrelles d'exemple repartides per les 4 regions -->
  <!-- Banda diagonal -->
  <circle cx="132" cy="102" r="4" fill="#60a5fa"/>
  <circle cx="165" cy="126" r="3.5" fill="#93c5fd"/>
  <circle cx="205" cy="154" r="3.2" fill="#bfdbfe"/>
  <circle cx="248" cy="176" r="3" fill="#e0f2fe"/>
  <circle cx="288" cy="196" r="2.8" fill="#f8fafc"/>
  <circle cx="332" cy="212" r="2.7" fill="#fef9c3"/>
  <circle cx="378" cy="224" r="2.6" fill="#fef08a"/>
  <circle cx="462" cy="256" r="2.4" fill="#fdba74"/>
  <circle cx="508" cy="278" r="2.3" fill="#fb923c"/>
  <circle cx="545" cy="304" r="2.1" fill="#f87171"/>
  <circle cx="578" cy="328" r="2" fill="#ef4444"/>

  <!-- Regió superior dreta -->
  <circle cx="478" cy="186" r="3.8" fill="#fdba74"/>
  <circle cx="496" cy="158" r="4.2" fill="#fb923c"/>
  <circle cx="548" cy="146" r="4.6" fill="#f87171"/>
  <circle cx="566" cy="160" r="4" fill="#fb923c"/>

  <!-- Regió superior -->
  <circle cx="235" cy="84" r="5" fill="#93c5fd"/>
  <circle cx="345" cy="82" r="5" fill="#fef9c3"/>
  <circle cx="485" cy="86" r="5.5" fill="#f87171"/>

  <!-- Regió inferior esquerra -->
  <circle cx="205" cy="312" r="2.2" fill="#e0f2fe"/>
  <circle cx="255" cy="316" r="2.2" fill="#f8fafc"/>
  <circle cx="305" cy="322" r="2" fill="#bae6fd"/>

  <!-- Marcadors neutres '?' a les zones sense nom -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="530" y="88" fill="#fde68a" opacity="0.85">Zona ?</text>
    <text x="530" y="170" fill="#fed7aa" opacity="0.9">Zona ?</text>
    <text x="265" y="320" fill="#bae6fd" opacity="0.85">Zona ?</text>
  </g>

  <!-- SOL (420, 236) -->
  <circle cx="420" cy="236" r="14" fill="url(#sun-glow)"/>
  <circle cx="420" cy="236" r="5.5" fill="#fde047" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Etiqueta del Sol -->
  <rect x="434" y="212" width="136" height="30" rx="6" fill="#0f172a" fill-opacity="0.94" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="502" y="226" text-anchor="middle" fill="#fde047" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700">El Sol (G2V, 1 L☉)</text>
  <text x="502" y="238" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10">~5.800 K</text>

  <!-- Eix X superior: Classes espectrals -->
  <text x="355" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600">Classe espectral</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="130" y="48" fill="#60a5fa">O</text>
    <text x="200" y="48" fill="#93c5fd">B</text>
    <text x="275" y="48" fill="#e0f2fe">A</text>
    <text x="350" y="48" fill="#fef9c3">F</text>
    <text x="420" y="48" fill="#fde047">G</text>
    <text x="495" y="48" fill="#fb923c">K</text>
    <text x="570" y="48" fill="#f87171">M</text>
  </g>

  <!-- Eix X inferior: Temperatura -->
  <g fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="130" y="366">30.000 K</text>
    <text x="275" y="366">10.000 K</text>
    <text x="420" y="366">5.800 K</text>
    <text x="570" y="366">3.000 K</text>
  </g>
  <text x="355" y="394" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="600">Temperatura superficial (decreix cap a la dreta →)</text>

  <!-- Eix Y esquerre: Lluminositat -->
  <g fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" text-anchor="end">
    <text x="86" y="78">10⁶</text>
    <text x="86" y="132">10⁴</text>
    <text x="86" y="186">10²</text>
    <text x="86" y="240" fill="#fde047" font-weight="700">1</text>
    <text x="86" y="294">10⁻²</text>
    <text x="86" y="348">10⁻⁴</text>
  </g>
  <text x="26" y="205" transform="rotate(-90 26 205)" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="600">Lluminositat (L☉)</text>
</svg>
