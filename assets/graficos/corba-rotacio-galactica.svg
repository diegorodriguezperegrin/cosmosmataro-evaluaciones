<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Corba de rotació d'una galàxia espiral típica</title>
  <desc id="svg-desc">Gràfica de velocitat orbital en quilòmetres per segon en funció de la distància al centre de la galàxia en kiloparsecs. Compara la corba teòrica kepleriana esperada, que decau a l'exterior del disc visible, amb la corba observada real, que es manté pràcticament plana al voltant dels 220 km/s.</desc>
  <defs>
    <radialGradient id="rot-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#13203d"/>
      <stop offset="100%" stop-color="#070c19"/>
    </radialGradient>
    <linearGradient id="visible-gal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="anomaly-gap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="680" height="420" rx="14" fill="url(#rot-bg)"/>

  <!-- Àrea del gràfic: x = 95..620 (0..30 kpc), y = 62..344 (300..0 km/s) -->
  <rect x="95" y="62" width="525" height="282" rx="6" fill="#060913" fill-opacity="0.72" stroke="#334155" stroke-width="1.2"/>

  <!-- Zona del nucli i disc visible (0..12 kpc -> x = 95..305) -->
  <rect x="95" y="62" width="210" height="282" fill="url(#visible-gal)"/>
  <line x1="305" y1="62" x2="305" y2="344" stroke="#64748b" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="200" y="84" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600">Disc estel·lar visible</text>

  <!-- Quadrícula -->
  <g stroke="#1e293b" stroke-width="1">
    <!-- Horitzontals (300, 250, 200, 150, 100, 50, 0) -->
    <line x1="95" y1="62" x2="620" y2="62"/>
    <line x1="95" y1="109" x2="620" y2="109"/>
    <line x1="95" y1="156" x2="620" y2="156"/>
    <line x1="95" y1="203" x2="620" y2="203"/>
    <line x1="95" y1="250" x2="620" y2="250"/>
    <line x1="95" y1="297" x2="620" y2="297"/>
    <!-- Verticals (5, 10, 15, 20, 25, 30 kpc) -->
    <line x1="182.5" y1="62" x2="182.5" y2="344"/>
    <line x1="270" y1="62" x2="270" y2="344"/>
    <line x1="357.5" y1="62" x2="357.5" y2="344"/>
    <line x1="445" y1="62" x2="445" y2="344"/>
    <line x1="532.5" y1="62" x2="532.5" y2="344"/>
  </g>

  <!-- Ombrejat de diferència entre les dues corbes (a partir de x=182.5) -->
  <path d="M 182.5 148 C 245 140, 340 137, 610 138 L 610 278 C 510 268, 390 245, 290 202 C 240 180, 208 162, 182.5 148 Z" fill="url(#anomaly-gap)"/>

  <!-- Corba 1: Predicció kepleriana (cau amb 1/sqrt(r)) -->
  <path d="M 95 344 C 118 275, 145 162, 182.5 148 C 218 138, 255 178, 305 208 C 375 244, 485 266, 610 278" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round"/>

  <!-- Corba 2: Observació real (pràcticament plana ~220 km/s) -->
  <path d="M 95 344 C 116 268, 144 156, 182.5 144 C 240 132, 345 137, 610 138" fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Punts de mesura observacionals -->
  <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="145" cy="186" r="3.5"/>
    <circle cx="205" cy="141" r="3.5"/>
    <circle cx="270" cy="136" r="3.5"/>
    <circle cx="357.5" cy="136" r="3.5"/>
    <circle cx="445" cy="137" r="3.5"/>
    <circle cx="532.5" cy="137" r="3.5"/>
    <circle cx="595" cy="138" r="3.5"/>
  </g>

  <!-- Fletxa indicant la discrepància entre les dues corbes -->
  <line x1="490" y1="145" x2="490" y2="258" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="490,141 486,149 494,149" fill="#38bdf8"/>
  <polygon points="490,262 486,254 494,254" fill="#fbbf24"/>
  <rect x="415" y="188" width="150" height="26" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#475569" stroke-width="1"/>
  <text x="490" y="205" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600">Discrepància observada</text>

  <!-- Llegenda superior dreta -->
  <rect x="358" y="22" width="262" height="52" rx="8" fill="#0b1224" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
  <line x1="372" y1="39" x2="404" y2="39" stroke="#38bdf8" stroke-width="3"/>
  <text x="414" y="43" fill="#e0f2fe" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600">Velocitat observada (~220 km/s)</text>
  <line x1="372" y1="59" x2="404" y2="59" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="414" y="63" fill="#fde68a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600">Predicció teòrica (Kepler)</text>

  <!-- Etiquetes Eix Y -->
  <g fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" text-anchor="end">
    <text x="86" y="66">300</text>
    <text x="86" y="113">250</text>
    <text x="86" y="160">200</text>
    <text x="86" y="207">150</text>
    <text x="86" y="254">100</text>
    <text x="86" y="301">50</text>
    <text x="86" y="348">0</text>
  </g>
  <text x="28" y="203" transform="rotate(-90 28 203)" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="600">Velocitat orbital (km/s)</text>

  <!-- Etiquetes Eix X -->
  <g fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="95" y="366">0</text>
    <text x="182.5" y="366">5</text>
    <text x="270" y="366">10</text>
    <text x="357.5" y="366">15</text>
    <text x="445" y="366">20</text>
    <text x="532.5" y="366">25</text>
    <text x="615" y="366">30</text>
  </g>
  <text x="357" y="394" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="600">Distància al centre de la galàxia (kpc)</text>
</svg>
