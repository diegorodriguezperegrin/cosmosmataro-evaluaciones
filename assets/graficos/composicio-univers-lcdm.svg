<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Composició de l'Univers segons el model ΛCDM</title>
  <desc id="svg-desc">Diagrama de sectors de la composició del cosmos segons les dades de precisió del satèl·lit Planck (missió ESA): 68% d'energia fosca, 27% de matèria fosca i només un 5% de matèria ordinària (amb prou feines un 0,5% en estrelles i planetes).</desc>
  <defs>
    <radialGradient id="lcdm-bg" cx="40%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111d38"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="dark-energy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="dark-matter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="baryonic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fons -->
  <rect width="680" height="420" rx="14" fill="url(#lcdm-bg)"/>

  <!-- Títol superior -->
  <text x="32" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Composició de l'Univers Actual · Model Cosmologic Estàndard (ΛCDM)</text>
  <text x="32" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Dades observacionals de precisió de la missió Planck (Fons Còsmic de Microones)</text>

  <!-- PANELL ESQUERRA: DONUT CHART DE L'UNIVERS (Centre: 210, 215, R=125, r=62) -->
  <g>
    <!-- Segment 1: ENERGIA FOSCA (68%) -->
    <path d="M 210 90 A 125 125 0 1 1 96.9 268.2 L 153.9 241.4 A 62 62 0 1 0 210 153 Z" fill="url(#dark-energy-grad)" stroke="#1e1b4b" stroke-width="2"/>

    <!-- Segment 2: MATÈRIA FOSCA (27%) -->
    <path d="M 96.9 268.2 A 125 125 0 0 1 171.4 96.1 L 190.8 156.0 A 62 62 0 0 0 153.9 241.4 Z" fill="url(#dark-matter-grad)" stroke="#082f49" stroke-width="2"/>

    <!-- Segment 3: MATÈRIA ORDINÀRIA / BARIÒNICA (5%) -->
    <path d="M 171.4 96.1 A 125 125 0 0 1 210 90 L 210 153 A 62 62 0 0 0 190.8 156.0 Z" fill="url(#baryonic-grad)" stroke="#451a03" stroke-width="2"/>
  </g>

  <!-- Centre del donut chart -->
  <circle cx="210" cy="215" r="58" fill="#090f1f" stroke="#334155" stroke-width="1.2"/>
  <text x="210" y="208" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Univers</text>
  <text x="210" y="224" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">100%</text>
  <text x="210" y="238" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9">(13.800 Ma)</text>

  <!-- Percentatges directament sobre els sectors -->
  <!-- Energia Fosca -->
  <text x="280" y="260" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">68%</text>
  <text x="280" y="278" text-anchor="middle" fill="#f3e8ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Energia fosca</text>

  <!-- Matèria Fosca -->
  <text x="125" y="185" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">27%</text>
  <text x="125" y="200" text-anchor="middle" fill="#e0f2fe" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Matèria fosca</text>

  <!-- Matèria Bariònica (Fletxa exterior perquè el sector 5% és estret) -->
  <line x1="190" y1="92" x2="165" y2="60" stroke="#fde047" stroke-width="1.5"/>
  <rect x="110" y="38" width="95" height="30" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="157" y="52" text-anchor="middle" fill="#fde047" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">5% Ordinària</text>
  <text x="157" y="63" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5">(Bariònica)</text>

  <!-- PANELL DRETA: CAIXES DESCRIPTIVES I DESGLOSSAMENT (x: 375..650) -->
  <!-- Targeta 1: Energia Fosca (68%) -->
  <rect x="375" y="65" width="275" height="66" rx="8" fill="#150d2a" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="395" cy="85" r="7" fill="#a855f7"/>
  <text x="410" y="89" fill="#f3e8ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Energia Fosca · ~68% (Ω_Λ)</text>
  <text x="410" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10">Propietat intrínseca de l'espaitemps (constant Λ).</text>
  <text x="410" y="118" fill="#c084fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Condueix l'expansió accelerada de l'Univers.</text>

  <!-- Targeta 2: Matèria Fosca (27%) -->
  <rect x="375" y="142" width="275" height="66" rx="8" fill="#082035" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="395" cy="162" r="7" fill="#38bdf8"/>
  <text x="410" y="166" fill="#e0f2fe" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Matèria Fosca · ~27% (Ω_c)</text>
  <text x="410" y="182" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10">Partícules massives no bariòniques (CDM).</text>
  <text x="410" y="195" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Manté unides les galàxies per gravetat.</text>

  <!-- Targeta 3: Matèria Ordinària i Desglossament (5%) -->
  <rect x="375" y="219" width="275" height="106" rx="8" fill="#1f1807" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="395" cy="239" r="7" fill="#fbbf24"/>
  <text x="410" y="243" fill="#fef08a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Matèria Ordinària (Bariònica) · ~5%</text>
  <text x="410" y="259" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10">Tot allò fet d'àtoms (protons, neutrons i electrons):</text>
  
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">
    <rect x="410" y="268" width="225" height="22" rx="4" fill="#2d220a" stroke="#d97706" stroke-width="0.8"/>
    <text x="418" y="283" fill="#fde68a" font-weight="600">• ~4,5%:</text>
    <text x="462" y="283" fill="#e2e8f0">Gas i pols intergalàctica d'H i He</text>

    <rect x="410" y="295" width="225" height="22" rx="4" fill="#362908" stroke="#f59e0b" stroke-width="1"/>
    <text x="418" y="310" fill="#fde047" font-weight="700">• Només ~0,5%:</text>
    <text x="500" y="310" fill="#ffffff" font-weight="600">Estrelles, planetes i vida</text>
  </g>

  <!-- FRANJA INFERIOR DESTACADA: EL 95% SECTOR FOSC -->
  <rect x="35" y="360" width="615" height="38" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="342" y="378" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
    Conclusió: el <tspan fill="#f43f5e">95%</tspan> de la massa-energia del cosmos és de naturalesa desconeguda (el «Sector Fosc»)
  </text>
  <text x="342" y="391" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">
    Tota l'astronomia visible clàssica estudia només la petita fracció del 0,5% d'estrelles brillants.
  </text>
</svg>
