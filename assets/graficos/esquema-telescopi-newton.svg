<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Esquema òptic d'un telescopi reflector Newtonià</title>
  <desc id="svg-desc">Secció longitudinal d'un telescopi reflector Newton: la llum estel·lar paral·lela entra per l'obertura frontal, viatja fins al fons del tub i es reflecteix en el mirall primari còncau parabòlic, convergeix cap a un mirall secundari pla diagonal inclinat a 45 graus, i surt desviada 90 graus cap a l'ocular situat al lateral superior del tub.</desc>
  <defs>
    <radialGradient id="scope-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111d38"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="primary-mirror-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ray-grad-in" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ray-grad-refl" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Fons -->
  <rect width="680" height="420" rx="14" fill="url(#scope-bg)"/>

  <!-- Títol de l'esquema -->
  <text x="32" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Telescopi Reflector Newtonià · Traçat de raigs òptics</text>
  <text x="32" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Sistema exclusivament reflectant basat en dos miralls (primari parabòlic i secundari pla)</text>

  <!-- SECCIÓ DEL TUB DEL TELESCOPI (x: 120..545, y: 165..315 -> alçada = 150) -->
  <!-- Cos del tub òptic (interior fosc) -->
  <rect x="120" y="165" width="425" height="150" rx="4" fill="#030712" stroke="#475569" stroke-width="2.5"/>

  <!-- Parets superior i inferior del tub (metàl·liques) -->
  <rect x="120" y="160" width="425" height="8" rx="2" fill="#334155"/>
  <rect x="120" y="312" width="425" height="8" rx="2" fill="#334155"/>

  <!-- Obertura frontal (Boca del telescopi a x = 120, sense cap lent) -->
  <ellipse cx="120" cy="240" rx="5" ry="74" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- PORTAOCULAR I OCULAR AL LATERAL SUPERIOR (x: 215, y: 80..160) -->
  <!-- Tub portaocular -->
  <rect x="195" y="125" width="40" height="35" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <!-- Ocular inserit -->
  <rect x="190" y="90" width="50" height="35" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="198" y="75" width="34" height="15" rx="2" fill="#0284c7"/>
  <text x="215" y="66" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Ocular (lateral)</text>

  <!-- Simbologia de l'ull de l'observador -->
  <path d="M 195 44 C 205 34, 225 34, 235 44 C 225 54, 205 54, 195 44 Z" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="215" cy="44" r="4" fill="#38bdf8"/>

  <!-- MIRALL PRIMARI CÒNCAU PARABÒLIC AL FONS (x: 535..550, y: 172..308) -->
  <!-- Base de suport del mirall primari -->
  <rect x="545" y="165" width="12" height="150" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Corba còncava del mirall parabòlic -->
  <path d="M 545 172 C 522 210, 522 270, 545 308 L 548 308 L 548 172 Z" fill="url(#primary-mirror-grad)" stroke="#93c5fd" stroke-width="2"/>

  <!-- MIRALL SECUNDARI PLA DIAGONAL A 45° (x: 215, y: 240) -->
  <!-- Aranya / suport (potes) -->
  <line x1="215" y1="165" x2="215" y2="225" stroke="#64748b" stroke-width="1.5"/>
  <line x1="215" y1="255" x2="215" y2="315" stroke="#64748b" stroke-width="1.5"/>
  <!-- Suport i mirall pla a 45° (línia inclinada de 200,225 a 230,255) -->
  <polygon points="200,224 204,220 234,250 230,254" fill="#475569"/>
  <line x1="202" y1="222" x2="232" y2="252" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- TRAÇAT DE RAIGS DE LLUM -->
  <!-- 1. Feixos d'entrada paral·lels (Llum d'una estrella llunyana) -->
  <g stroke="url(#ray-grad-in)" stroke-width="1.8">
    <!-- Raig superior -->
    <line x1="25" y1="180" x2="538" y2="180"/>
    <!-- Raig intermedi superior -->
    <line x1="25" y1="210" x2="532" y2="210"/>
    <!-- Raig intermedi inferior -->
    <line x1="25" y1="270" x2="532" y2="270"/>
    <!-- Raig inferior -->
    <line x1="25" y1="300" x2="538" y2="300"/>
  </g>
  <!-- Fletxes d'entrada de la llum -->
  <polygon points="75,180 65,176 65,184" fill="#38bdf8"/>
  <polygon points="75,300 65,296 65,304" fill="#38bdf8"/>
  <text x="70" y="244" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Llum incident</text>
  <text x="70" y="258" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Raigs paral·lels</text>

  <!-- 2. Feixos reflectits convergents pel primari cap al secundari -->
  <g stroke="url(#ray-grad-refl)" stroke-width="2">
    <!-- Des de dalt (538, 180) cap al mirall secundari (210, 230) -->
    <line x1="538" y1="180" x2="210" y2="230"/>
    <!-- Des de baix (538, 300) cap al mirall secundari (224, 244) -->
    <line x1="538" y1="300" x2="224" y2="244"/>
  </g>

  <!-- 3. Feixos reflectits pel secundari a 90° cap a l'ocular -->
  <g stroke="#fde047" stroke-width="2.2">
    <line x1="210" y1="230" x2="210" y2="90"/>
    <line x1="224" y1="244" x2="220" y2="90"/>
  </g>
  <!-- Focus òptic (on convergeix la imatge just a l'ocular) -->
  <circle cx="215" cy="115" r="3.5" fill="#fde047"/>

  <!-- CAIXES I ETIQUETES DESCRIPTIUES -->
  <!-- Mirall primari -->
  <rect x="470" y="340" width="185" height="52" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1"/>
  <text x="562" y="357" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. Mirall Primari</text>
  <text x="562" y="372" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Còncau parabòlic al fons.</text>
  <text x="562" y="385" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Concentra i enfoca la llum.</text>
  <line x1="562" y1="340" x2="540" y2="308" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Mirall secundari -->
  <rect x="250" y="340" width="185" height="52" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#fbbf24" stroke-width="1"/>
  <text x="342" y="357" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. Mirall Secundari</text>
  <text x="342" y="372" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Pla diagonal a 45°.</text>
  <text x="342" y="385" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Desvia el feix 90° al lateral.</text>
  <line x1="320" y1="340" x2="230" y2="255" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Targeta destacada: 0 Lents a l'objectiu -->
  <rect x="35" y="340" width="180" height="52" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="1"/>
  <text x="125" y="358" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">100% Miralls</text>
  <text x="125" y="374" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Sense aberració cromàtica.</text>
  <text x="125" y="386" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Disseny d'Isaac Newton (1668).</text>
</svg>
